name: bench

on:
  schedule:
    - cron: "23 4 * * *"  # nightly at 04:23 UTC
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake --preset release -DPOLLIWOG_BENCH=ON

      - name: build
        run: cmake --build --preset release

      - name: download pond corpus
        shell: bash
        run: |
          set -e
          dir="test/pond/corpus/large"
          mkdir -p "$dir"
          url="https://raw.githubusercontent.com/MiloszKrajewski/SilesiaCorpus/master"
          files="dickens mozilla mr nci ooffice osdb reymont samba sao webster xml x-ray"
          for f in $files; do
            if [ ! -f "$dir/$f" ]; then
              echo "downloading $f"
              curl -sS -o "$dir/$f.zip" "$url/$f.zip"
              unzip -o -d "$dir" "$dir/$f.zip"
              rm "$dir/$f.zip"
            fi
          done

      - name: run benchmarks
        run: >
          ./build/default/bench/Release/polliwog-bench.exe
          --benchmark_format=console
          --benchmark_out=benchmark_results.json
          --benchmark_out_format=json

      - name: upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ github.sha }}
          path: benchmark_results.json
          retention-days: 90
