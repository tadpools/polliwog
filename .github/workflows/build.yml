name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
        backend: [zlib-only, all-backends]
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake --preset default
          ${{ matrix.backend == 'all-backends' && '-DPOLLIWOG_WITH_ZSTD=ON -DPOLLIWOG_WITH_LZ4=ON -DPOLLIWOG_WITH_ZLIB_NG=ON' || '' }}

      - name: build
        run: cmake --build --preset default

      - name: download pond corpus
        shell: bash
        run: |
          set -e
          dir="test/pond/corpus/large"
          mkdir -p "$dir"
          url="http://sun.aei.polsl.pl/~sdeor/corpus"
          files="dickens mozilla mr nci ooffice osdb reymont samba sao webster xml x-ray"
          for f in $files; do
            if [ ! -f "$dir/$f" ]; then
              echo "downloading $f"
              curl -sS -o "$dir/$f" "$url/$f"
            fi
          done

      - name: verify checksums
        shell: bash
        run: |
          set -e
          dir="test/pond/corpus/large"
          declare -A md5s=(
            [dickens]=88334708559f6db57d79096bc0aca07e
            [mozilla]=c7789a2097f1ff944b0c737430a339b3
            [mr]=38e623e3093b7bf2003ca4b1bbc19927
            [nci]=31f85bc8706f3c921104e7c169e2e2e1
            [ooffice]=573c4ae915e36631d8f2dcffb9b9b66d
            [osdb]=e734b0c48e6a982adfb5802da3032ecd
            [reymont]=d8f54d78105079775f32d76dc55fc671
            [samba]=154eaea7ea70e89f6339ff0abf4112ca
            [sao]=79e95a22e18cd82b7e42bf91b380d30b
            [webster]=474931ad907ac27bf962c75ded46c069
            [xml]=9b09c0c80104adb8aae910b7d7db003e
            [x-ray]=9baec32ad14ec3eff487d254382cb91c
          )
          ok=true
          for f in "${!md5s[@]}"; do
            actual=$(md5sum "$dir/$f" | awk '{print $1}')
            if [ "$actual" != "${md5s[$f]}" ]; then
              echo "mismatch: $f expected ${md5s[$f]} got $actual"
              ok=false
            fi
          done
          if [ "$ok" = false ]; then exit 1; fi
          echo "all checksums verified"

      - name: test
        run: ctest --preset default
